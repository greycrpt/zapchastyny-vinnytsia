<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запчастини та Авто - Вінниця</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            position: relative;
            min-height: 100vh;
        }

        /* Анімований фон з частицами */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 50%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(255, 0, 127, 0.1) 0%, transparent 50%),
                        linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 25%, #0f0f1e 50%, #16003b 75%, #0a0a0a 100%);
            animation: gradientShift 15s ease infinite;
            z-index: -1;
        }

        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* Частицы */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.8), transparent);
            border-radius: 50%;
            filter: blur(0.5px);
        }

        /* Основний контейнер */
        .wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Карточка сайту */
        .card {
            width: 100%;
            max-width: 500px;
            background: rgba(15, 15, 30, 0.7);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 30px;
            padding: 0;
            overflow: hidden;
            backdrop-filter: blur(30px);
            box-shadow:
                0 8px 32px rgba(0, 212, 255, 0.2),
                inset 0 0 60px rgba(0, 212, 255, 0.05),
                0 0 100px rgba(0, 212, 255, 0.1);
            animation: cardFloat 6s ease-in-out infinite, cardGlow 3s ease-in-out infinite;
            transform: perspective(1000px);
        }

        @keyframes cardFloat {
            0%, 100% {
                transform: translateY(0px) rotateX(0deg);
            }
            50% {
                transform: translateY(-20px) rotateX(2deg);
            }
        }

        @keyframes cardGlow {
            0%, 100% {
                box-shadow:
                    0 8px 32px rgba(0, 212, 255, 0.2),
                    inset 0 0 60px rgba(0, 212, 255, 0.05),
                    0 0 100px rgba(0, 212, 255, 0.1);
                border-color: rgba(0, 212, 255, 0.3);
            }
            50% {
                box-shadow:
                    0 8px 40px rgba(0, 212, 255, 0.4),
                    inset 0 0 80px rgba(0, 212, 255, 0.1),
                    0 0 150px rgba(0, 212, 255, 0.2);
                border-color: rgba(0, 212, 255, 0.6);
            }
        }

        /* Баннер */
        .banner {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(0, 212, 255, 0.1) 0%, transparent 100%);
            border-bottom: 2px solid rgba(0, 212, 255, 0.2);
        }

        .banner-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }

        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(10,10,10,0.3) 0%, rgba(10,10,10,0.8) 100%);
            z-index: 2;
        }

        .banner-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 3;
            padding: 30px 30px 40px;
            text-align: center;
        }

        .store-name {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(120deg, #00D4FF, #0088FF, #00D4FF);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            letter-spacing: 3px;
            margin-bottom: 8px;
            animation: nameShine 3s ease-in-out infinite, nameWave 4s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.4));
        }

        @keyframes nameShine {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes nameWave {
            0%, 100% {
                text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            }
            50% {
                text-shadow: 0 0 60px rgba(0, 212, 255, 0.8), 0 0 30px rgba(0, 0, 255, 0.4);
            }
        }

        .store-tagline {
            font-size: 14px;
            color: rgba(0, 212, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 700;
        }

        /* Контент */
        .content {
            padding: 40px 30px;
        }

        .divider {
            height: 3px;
            background: linear-gradient(90deg, transparent, #00D4FF, #0088FF, transparent);
            margin: 25px 0;
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
            animation: dividerGlow 2s ease-in-out infinite;
        }

        @keyframes dividerGlow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
            }
            50% {
                box-shadow: 0 0 40px rgba(0, 212, 255, 1);
            }
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .link-btn {
            position: relative;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 136, 255, 0.05));
            border: 2px solid rgba(0, 212, 255, 0.4);
            border-radius: 16px;
            padding: 18px 24px;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            backdrop-filter: blur(20px);
        }

        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.4), transparent);
            transition: left 0.7s ease;
            z-index: 1;
        }

        .link-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(0, 212, 255, 0.2), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 0;
        }

        .link-btn:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 136, 255, 0.15));
            border-color: rgba(0, 212, 255, 0.8);
            transform: translateY(-6px) scale(1.02);
            box-shadow:
                0 15px 40px rgba(0, 212, 255, 0.3),
                inset 0 0 20px rgba(0, 212, 255, 0.1),
                0 0 60px rgba(0, 212, 255, 0.2);
        }

        .link-btn:hover::before {
            left: 100%;
        }

        .link-btn:hover::after {
            opacity: 1;
        }

        .link-content {
            display: flex;
            align-items: center;
            flex: 1;
            position: relative;
            z-index: 2;
        }

        .link-icon {
            font-size: 28px;
            margin-right: 16px;
            animation: iconBounce 2s ease-in-out infinite;
        }

        @keyframes iconBounce {
            0%, 100% {
                transform: translateY(0px);
                filter: drop-shadow(0 0 0px rgba(0, 212, 255, 0.5));
            }
            50% {
                transform: translateY(-4px);
                filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.8));
            }
        }

        .link-text {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            position: relative;
            z-index: 2;
        }

        .link-arrow {
            font-size: 24px;
            color: #00D4FF;
            transition: all 0.4s ease;
            position: relative;
            z-index: 2;
            margin-left: 12px;
            filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.5));
        }

        .link-btn:hover .link-arrow {
            transform: translateX(8px) rotate(45deg);
            filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.8));
        }

        /* Опис */
        .description-box {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.08), rgba(0, 136, 255, 0.04));
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 16px;
            padding: 28px;
            margin: 30px 0;
            backdrop-filter: blur(20px);
            box-shadow: inset 0 0 30px rgba(0, 212, 255, 0.05);
        }

        .description-box h3 {
            color: #00D4FF;
            font-size: 18px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .description-box p {
            color: #ccc;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 14px;
        }

        .description-box p:last-child {
            margin-bottom: 0;
        }

        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }

        .feature-item {
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: #00D4FF;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .feature-item:hover {
            background: rgba(0, 212, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .final-divider {
            height: 3px;
            background: linear-gradient(90deg, transparent, #00D4FF, #0088FF, transparent);
            margin-top: 35px;
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
            animation: dividerGlow 2s ease-in-out infinite;
        }

        /* Адаптив */
        @media (max-width: 600px) {
            .card {
                border-radius: 20px;
                max-width: 95%;
            }

            .store-name {
                font-size: 36px;
                letter-spacing: 2px;
            }

            .content {
                padding: 30px 20px;
            }

            .link-text {
                font-size: 15px;
                letter-spacing: 1px;
            }

            .features-grid {
                grid-template-columns: 1fr;
            }

            .link-btn:hover {
                transform: translateY(-4px) scale(1.01);
            }
        }

        /* Завантаження */
        .card {
            animation: cardAppear 0.8s ease-out;
        }

        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Модальне вікно */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 136, 255, 0.05));
            border: 2px solid rgba(0, 212, 255, 0.4);
            border-radius: 20px;
            margin: 50% translate(-50%, -50%);
            padding: 40px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            backdrop-filter: blur(30px);
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.3);
            animation: slideIn 0.3s ease;
            max-width: 400px;
            width: 90%;
        }

        @keyframes slideIn {
            from {
                transform: translate(-50%, -60%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #00D4FF;
            font-size: 20px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .phone-number {
            font-size: 28px;
            font-weight: 900;
            color: #00D4FF;
            margin: 20px 0;
            letter-spacing: 2px;
            background: rgba(0, 212, 255, 0.1);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            flex-direction: column;
        }

        .modal-btn {
            padding: 14px 24px;
            border: 2px solid rgba(0, 212, 255, 0.5);
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 136, 255, 0.1));
            color: #00D4FF;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-btn:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.25), rgba(0, 136, 255, 0.15));
            border-color: rgba(0, 212, 255, 0.8);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
            transform: translateY(-2px);
        }

        .modal-btn.cancel {
            border-color: rgba(150, 150, 150, 0.5);
            color: #888;
            background: rgba(100, 100, 100, 0.1);
        }

        .modal-btn.cancel:hover {
            border-color: rgba(150, 150, 150, 0.8);
            color: #aaa;
            background: rgba(100, 100, 100, 0.2);
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>

    <!-- Модальне вікно для номера телефону -->
    <div id="phoneModal" class="modal">
        <div class="modal-content">
            <h2>📞 Номер телефону</h2>
            <div class="phone-number">+38 068 955 1163</div>
            <div class="modal-buttons">
                <button onclick="copyPhone()" class="modal-btn" style="background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 136, 255, 0.15));">📋 Копіювати</button>
                <a href="tel:+380689551163" class="modal-btn" style="text-decoration: none; display: block;">☎️ Позвонити</a>
                <button onclick="closePhoneModal()" class="modal-btn cancel">✕ Закрити</button>
            </div>
        </div>
    </div>

    <div class="wrapper">
        <div class="card">
            <div class="banner">
                <img src="/_blob/7e5b7527954d18146cdbb8ec177c1ae1" alt="Запчастини та Авто" class="banner-img">
                <div class="banner-content">
                </div>
            </div>

            <div class="content">
                <div class="divider"></div>

                <div class="links-grid">
                    <button onclick="showPhoneDialog()" class="link-btn" style="border: none; background: inherit; cursor: pointer; text-align: left;">
                        <div class="link-content">
                            <span class="link-icon">📞</span>
                            <span class="link-text">ПОЗВОНИТИ</span>
                        </div>
                        <span class="link-arrow">→</span>
                    </button>

                    <a href="https://t.me/zapchastuna_vin" target="_blank" class="link-btn">
                        <div class="link-content">
                            <span class="link-icon">✈️</span>
                            <span class="link-text">TELEGRAM</span>
                        </div>
                        <span class="link-arrow">→</span>
                    </a>

                    <a href="https://www.threads.com/@zapchastuna_vin?igshid=NTc4MTIwNjQ2YQ==" target="_blank" class="link-btn">
                        <div class="link-content">
                            <span class="link-icon">🔗</span>
                            <span class="link-text">ТРЕДС</span>
                        </div>
                        <span class="link-arrow">→</span>
                    </a>

                    <a href="https://www.tiktok.com/@zapchastuna_vin?_r=1&_t=ZS-9AAYpyKMUqq" target="_blank" class="link-btn">
                        <div class="link-content">
                            <span class="link-icon">🎵</span>
                            <span class="link-text">TIKTOK</span>
                        </div>
                        <span class="link-arrow">→</span>
                    </a>
                </div>

                <div class="divider"></div>

                <div class="description-box">
                    <h3>Запчастини та Авто</h3>
                    <p>Ваш надійний партнер в світі автозапчастин! Великий вибір оригінальних та якісних деталей для всіх марок авто.</p>

                    <div class="features-grid">
                        <div class="feature-item">⚡ Швидка доставка</div>
                        <div class="feature-item">💰 Дешево</div>
                        <div class="feature-item">👍 Якість</div>
                    </div>
                </div>

                <div class="final-divider"></div>
            </div>
        </div>
    </div>

    <script>
        // Частицы
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.width = (Math.random() * 3 + 2) + 'px';
                particle.style.height = particle.style.width;
                particle.style.animation = `float ${Math.random() * 20 + 15}s linear infinite`;
                container.appendChild(particle);
            }
        }

        // Анимация частиц
        const style = document.createElement('style');
        style.textContent = `
            @keyframes float {
                0% { transform: translateY(100vh) translateX(0); opacity: 0; }
                10% { opacity: 1; }
                90% { opacity: 1; }
                100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        createParticles();

        // Функции для модального окна
        function showPhoneDialog() {
            document.getElementById('phoneModal').style.display = 'block';
        }

        function closePhoneModal() {
            document.getElementById('phoneModal').style.display = 'none';
        }

        function copyPhone() {
            const phoneNumber = '+380689551163';
            navigator.clipboard.writeText(phoneNumber).then(() => {
                alert('✅ Номер телефону скопійовано!');
                closePhoneModal();
            }).catch(() => {
                // Fallback для старих браузерів
                const textarea = document.createElement('textarea');
                textarea.value = phoneNumber;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('✅ Номер телефону скопійовано!');
                closePhoneModal();
            });
        }

        // Закрити модаль при натисканні на фон
        window.onclick = function(event) {
            const modal = document.getElementById('phoneModal');
            if (event.target == modal) {
                closePhoneModal();
            }
        }
    </script>
</body>
</html>
